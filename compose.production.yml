# Standalone VM configuration. Do not merge with docker-compose.yml.
# Requires private .env.production and pre-existing, verified data volumes.
name: socialscope

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend: &backend
  # All Python services run exactly the same packaged release.
  image: ${SOCIALSCOPE_IMAGE_PREFIX:-socialscope}-backend:${SOCIALSCOPE_RELEASE:?Set a unique release tag}
  environment: &backend-environment
    DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:?Set restricted application login}:${APP_DB_URL_PASSWORD:?Set URL-encoded application password}@postgres:5432/${POSTGRES_DB:-socialscope}
    REDIS_URL: redis://redis:6379/0
    SECRET_KEY: ${SECRET_KEY:?Set a strong production signing secret}
    CORS_ORIGINS: ${SOCIALSCOPE_PUBLIC_ORIGIN:?Set the planned HTTPS origin}
    BUILD_ID: ${SOCIALSCOPE_RELEASE:?Set a unique release tag}
    SOCIALVAULT_API_KEY: ${SOCIALVAULT_API_KEY-}
    XPOZ_API_KEY: ${XPOZ_API_KEY-}
    OPENAI_API_KEY: ${OPENAI_API_KEY-}
    XPOZ_REQUESTS_PER_PERIOD: ${XPOZ_REQUESTS_PER_PERIOD-28}
    XPOZ_RATE_PERIOD_SECONDS: ${XPOZ_RATE_PERIOD_SECONDS-60}
    XPOZ_MAX_CONCURRENCY: ${XPOZ_MAX_CONCURRENCY-2}
    XPOZ_OPERATION_TIMEOUT_SECONDS: ${XPOZ_OPERATION_TIMEOUT_SECONDS-300}
    XPOZ_NO_PROGRESS_TIMEOUT_SECONDS: ${XPOZ_NO_PROGRESS_TIMEOUT_SECONDS-300}
    XPOZ_MAX_PAGES: ${XPOZ_MAX_PAGES-100}
    XPOZ_RETRY_TIME_BUDGET_SECONDS: ${XPOZ_RETRY_TIME_BUDGET_SECONDS-60}
    XPOZ_MAX_REPEATED_502: ${XPOZ_MAX_REPEATED_502-2}
    SOCIALVAULT_MAX_CONCURRENCY: ${SOCIALVAULT_MAX_CONCURRENCY-5}
    SOCIALVAULT_REQUESTS_PER_PERIOD: ${SOCIALVAULT_REQUESTS_PER_PERIOD-8}
    SOCIALVAULT_RATE_PERIOD_SECONDS: ${SOCIALVAULT_RATE_PERIOD_SECONDS-1}
    SOCIALVAULT_REQUEST_TIMEOUT_SECONDS: ${SOCIALVAULT_REQUEST_TIMEOUT_SECONDS-30}
    SOCIALVAULT_NO_PROGRESS_TIMEOUT_SECONDS: ${SOCIALVAULT_NO_PROGRESS_TIMEOUT_SECONDS-120}
    SOCIALVAULT_MAX_PAGES: ${SOCIALVAULT_MAX_PAGES-100}
    SOCIALVAULT_RETRY_TIME_BUDGET_SECONDS: ${SOCIALVAULT_RETRY_TIME_BUDGET_SECONDS-60}
    SOCIALVAULT_MAX_REPEATED_502: ${SOCIALVAULT_MAX_REPEATED_502-3}
    SOCIALVAULT_PAGINATION_404_RETRIES: ${SOCIALVAULT_PAGINATION_404_RETRIES-1}
    SOCIALVAULT_EARLY_RESTART_MAX_PAGES: ${SOCIALVAULT_EARLY_RESTART_MAX_PAGES-5}
    SOCIALVAULT_EARLY_RESTART_MAX_TARGET_RATIO: ${SOCIALVAULT_EARLY_RESTART_MAX_TARGET_RATIO-0.3}
    COLLECTION_CANCELLATION_POLL_SECONDS: ${COLLECTION_CANCELLATION_POLL_SECONDS-1}
    COLLECTION_ABANDONED_JOB_STALE_SECONDS: ${COLLECTION_ABANDONED_JOB_STALE_SECONDS-900}
    COLLECTION_ABANDONED_RECONCILE_INTERVAL_SECONDS: ${COLLECTION_ABANDONED_RECONCILE_INTERVAL_SECONDS-60}
    COLLECTION_ABANDONED_INSPECT_TIMEOUT_SECONDS: ${COLLECTION_ABANDONED_INSPECT_TIMEOUT_SECONDS-1}
    COLLECTION_ABANDONED_RECONCILE_BATCH_SIZE: ${COLLECTION_ABANDONED_RECONCILE_BATCH_SIZE-100}
    PROVIDER_MAX_RETRIES: ${PROVIDER_MAX_RETRIES-3}
    PROVIDER_RETRY_BASE_SECONDS: ${PROVIDER_RETRY_BASE_SECONDS-1}
    PROVIDER_RETRY_MAX_SECONDS: ${PROVIDER_RETRY_MAX_SECONDS-30}
    COLLECTION_WORKER_CONCURRENCY: "1"
    QUERY_SAFE_DEFAULT_MAX_LENGTH: ${QUERY_SAFE_DEFAULT_MAX_LENGTH-200}
    XPOZ_QUERY_MAX_LENGTH: ${XPOZ_QUERY_MAX_LENGTH-200}
    SOCIALVAULT_QUERY_MAX_LENGTH: ${SOCIALVAULT_QUERY_MAX_LENGTH-200}
    QUERY_LENGTH_WARNING_RATIO: ${QUERY_LENGTH_WARNING_RATIO-0.8}
    LOG_LEVEL: ${LOG_LEVEL-INFO}
    ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES-1440}
    ALGORITHM: ${ALGORITHM-HS256}
  init: true
  mem_limit: 768m
  cpus: 0.5
  logging: *logging

services:
  postgres:
    image: pgvector/pgvector:pg16
    mem_limit: 512m
    cpus: 0.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-socialscope}
      POSTGRES_DB: ${POSTGRES_DB:-socialscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the existing database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    mem_limit: 256m
    cpus: 0.25
    command: redis-server --appendonly yes --maxmemory 192mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  migrate:
    <<: *backend
    profiles: [maintenance]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-socialscope}:${POSTGRES_URL_PASSWORD:?Set URL-encoded maintenance password}@postgres:5432/${POSTGRES_DB:-socialscope}
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Deliberate initial provisioning only; excluded from normal startup.
  seed:
    <<: *backend
    profiles: [bootstrap]
    command: python -m app.seed
    environment:
      <<: *backend-environment
      LOCAL_ADMIN_EMAIL: ${LOCAL_ADMIN_EMAIL:?Set the initial administrator email}
      LOCAL_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:?Set a unique initial administrator password}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    volumes:
      - export_data:/tmp/socialscope_exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8001/api/health',timeout=3)); assert r.get('database') and r.get('redis')"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  worker:
    <<: *backend
    command: celery -A app.workers.celery_app worker -l info -Q collection,default,celery --concurrency=1 --hostname=worker@%h
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --destination worker@$$HOSTNAME --timeout 3 | grep -q pong"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    <<: *backend
    command: celery -A app.workers.celery_app beat -l info --schedule=/data/celerybeat-schedule --pidfile=/tmp/celerybeat.pid
    mem_limit: 256m
    cpus: 0.25
    volumes:
      - scheduler_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'test -s /tmp/celerybeat.pid && kill -0 "$$(cat /tmp/celerybeat.pid)"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ${SOCIALSCOPE_IMAGE_PREFIX:-socialscope}-frontend:${SOCIALSCOPE_RELEASE:?Set a unique release tag}
    build:
      context: ./frontend
    init: true
    mem_limit: 768m
    cpus: 0.5
    # Only a reverse proxy on this VM can reach this published port.
    ports:
      - "127.0.0.1:${SOCIALSCOPE_WEB_PORT:-3002}:3001"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    logging: *logging

volumes:
  # External volumes must exist: never silently initialize a different database.
  postgres_data:
    external: true
    name: ${SOCIALSCOPE_POSTGRES_VOLUME:?Set the verified existing PostgreSQL volume name}
  redis_data:
    external: true
    name: ${SOCIALSCOPE_REDIS_VOLUME:?Set the verified existing Redis volume name}
  export_data:
    external: true
    name: ${SOCIALSCOPE_EXPORT_VOLUME:?Set the verified existing export volume name}

  scheduler_data: {}
